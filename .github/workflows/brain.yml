name: brain
on:
  push:
    paths: ["brain/**", ".github/workflows/brain.yml"]
  pull_request:
    paths: ["brain/**", ".github/workflows/brain.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
        working-directory: brain
