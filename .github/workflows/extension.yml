name: extension
on:
  push:
    paths: ["extension/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extension/**", ".github/workflows/extension.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
